<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto 11 - Cookies</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <main class="contenido">
        <h1>Bienvenido a mi página</h1>
        <p>Esta es una página de ejemplo para demostrar el aviso de cookies.</p>
    </main>

    <section id="avisoCookies" class="aviso-cookies" role="dialog" aria-label="Aviso de cookies" aria-live="polite">
        <div class="texto-cookies">
            <h2>Usamos cookies</h2>
            <p>Este sitio utiliza cookies para recordar tu preferencia. Puedes aceptar para no volver a ver este aviso en este navegador.</p>
        </div>
        <button id="aceptarCookies" type="button">Aceptar</button>
    </section>

    <script src="script.js"></script>
</body>
</html>
